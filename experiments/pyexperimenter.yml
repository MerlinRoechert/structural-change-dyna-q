PY_EXPERIMENTER:
  n_jobs: 1

  Database:
    provider: sqlite
    database: experiments/pyexperimenter_results
    table:
      name: structural_change_experiments
      keyfields:
        algorithm:
          type: VARCHAR(20)
          values: [q-learning, dyna-q, dyna-q-plus]
        environment:
          type: VARCHAR(30)
          values: [two-routes, shortcut, mixed-stability]
        seed:
          type: INT
          values: [0]
        learning_rate:
          type: DOUBLE
          values: [0.1]
        discount_factor:
          type: DOUBLE
          values: [0.9]
        epsilon:
          type: DOUBLE
          values: [0.2]
        planning_steps:
          type: INT
          values: [10]
        exploration_bonus:
          type: DOUBLE
          values: [0.001]
        change_step:
          type: INT
          values: [1000]
        change_duration:
          type: INT
          values: [500]
        steps_after_change:
          type: INT
          values: [1000]
        max_episode_steps:
          type: INT
          values: [100]
    logtables:
      steps:
        global_step: INT
        reward: DOUBLE
        world_state: INT
        episode: INT
        stability_score: DOUBLE
        adaptation_mode: VARCHAR(30)
        change_detected: BOOL
      episodes:
        episode: INT
        end_step: INT
        end_reason: VARCHAR(30)
